<html>
<head>
    <title>Мой первый API клиент</title>
</head>
<body>
    <h1>покемон из Облака</h1>
    <button id="loadBtn">Загрузить фото покемона через API</button>
    <div id="pokemonInfo"></div>

    <script>
        const button = document.getElementById('loadBtn');
        const list = document.getElementById('pokemonInfo');

        button.addEventListener('click', async () => {
            button.innerText = 'Загрузка...';

            const response = await fetch('https://pokeapi.co/api/v2/pokemon/pikachu');
             const pokemon = await response.json();

            container.innerHTML = '';
            const name = document.createElement('h2');
            name.innerText = pokemon.name.toUpperCase();
                
            const img = document.createElement('img');
                
        img.src = pokemon.sprites.other['official-artwork'].front_default;
                img.alt = pokemon.name;
                img.style.width = '200px';
                
                container.appendChild(name);
                container.appendChild(img);


            button.innerText = 'ну типа покемон!';
        });
    </script>
</body>
</html>
